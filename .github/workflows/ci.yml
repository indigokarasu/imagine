name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate SKILL.md frontmatter
        run: python3 -c "import yaml,pathlib; fm=yaml.safe_load(pathlib.Path('SKILL.md').read_text().split('---')[1]); assert fm['name']=='ocas-imagine' and fm.get('description'); print('SKILL.md frontmatter OK')"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
